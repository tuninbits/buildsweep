name: Release binaries

# Builds a standalone executable (no Node.js required to run it) for
# Windows, macOS, and Linux, and attaches them to the GitHub release
# for any pushed tag like "v0.1.0".
#
# Linux/macOS binaries are packaged as .tar.gz: GitHub release assets lose
# the Unix executable bit on upload, but tar preserves file mode in its
# header, so extracting the archive restores +x without a manual chmod.
# Windows .exe files don't need the executable bit, so that one ships bare.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: buildsweep-linux
            artifact: buildsweep-linux.tar.gz
          - os: macos-latest
            binary: buildsweep-macos
            artifact: buildsweep-macos.tar.gz
          - os: windows-latest
            binary: buildsweep-windows.exe
            artifact: buildsweep-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build:binary
      - name: Package archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.binary }}"
          tar -C dist -czf "dist/${{ matrix.artifact }}" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
